<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}BestHome Admin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}" />
  </head>
  <body class="app-bg">
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-semibold" href="/admin">BestHome DM Admin</a>
        <span class="badge text-bg-light border">ManyChat-like Inbox</span>
      </div>
    </nav>

    <div class="container-fluid py-4 px-4">
      <div class="row g-3">
        <aside class="col-12 col-lg-2">
          <div class="card shadow-sm border-0">
            <div class="card-body p-2">
              <a href="/admin" class="nav-link rounded px-3 py-2 {% if active_page == 'inbox' %}active-nav{% endif %}">Inbox</a>
              <a href="/admin/templates" class="nav-link rounded px-3 py-2 {% if active_page == 'templates' %}active-nav{% endif %}">DM Şablonları</a>
              <a href="/admin/posts" class="nav-link rounded px-3 py-2 {% if active_page == 'posts' %}active-nav{% endif %}">Post Seçimi</a>
            </div>
          </div>
        </aside>

        <main class="col-12 col-lg-10">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <script src="{{ url_for('static', path='app.js') }}"></script>
  </body>
</html>
