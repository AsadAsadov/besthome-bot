{% extends 'base.html' %}
{% block title %}Thread {{ selected_thread }} | BestHome Admin{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm">
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Thread: @{{ selected_thread }}</h5>
    <a href="/admin" class="btn btn-sm btn-outline-secondary">Inbox-a qayıt</a>
  </div>
  <div class="card-body">
    <div class="chat-area mb-3">
      {% for m in messages %}
      <div class="bubble-row {{ 'outgoing' if m.direction == 'outgoing' else 'incoming' }}">
        <div class="bubble">{{ m.text }}</div>
      </div>
      {% endfor %}
      {% if not messages %}
      <div class="text-muted">Bu thread üçün mesaj yoxdur.</div>
      {% endif %}
    </div>

    <form method="post" action="/admin/message-reply" class="row g-2">
      <input type="hidden" name="thread_id" value="{{ selected_thread }}" />
      <div class="col-12 col-md-10">
        <textarea name="text" class="form-control" rows="2" placeholder="Cavab mesajı yazın" required></textarea>
      </div>
      <div class="col-12 col-md-2 d-grid">
        <button type="submit" class="btn btn-primary">Göndər</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
